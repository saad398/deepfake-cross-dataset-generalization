# Dataset Configuration
data:
  train_dataset: "FaceForensics++"
  test_datasets: ["FaceForensics++", "Celeb-DF", "DFDC"]
  data_root: "./data/datasets"
  image_size: 224
  batch_size: 32
  num_workers: 4
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  
# Model Configuration
model:
  architecture: "xception"  # or "efficientnet"
  pretrained: true
  num_classes: 2
  dropout: 0.5
  
# Training Configuration
training:
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.00001
  optimizer: "adam"
  scheduler: "reduce_on_plateau"
  scheduler_patience: 5
  scheduler_factor: 0.5
  early_stopping_patience: 10
  gradient_clip: 1.0
  mixed_precision: false
  save_dir: "./checkpoints"
  
# Augmentation Configuration
augmentation:
  type: "robust"  # or "basic"
  gaussian_blur:
    enabled: true
    kernel_sizes: [3, 5, 7]
    sigma: [0.1, 2.0]
  jpeg_compression:
    enabled: true
    quality_lower: 70
    quality_upper: 100
  gaussian_noise:
    enabled: true
    var_limit: [10.0, 50.0]
  color_jitter:
    enabled: true
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
  resolution_scaling:
    enabled: true
    scale_limit: [0.8, 1.2]
  horizontal_flip:
    enabled: true
    probability: 0.5
  random_crop:
    enabled: true
    scale: [0.8, 1.0]
    ratio: [0.9, 1.1]
  
# Evaluation Configuration
evaluation:
  save_predictions: true
  compute_roc: true
  visualize_results: true
  results_dir: "./results"
  
# Logging Configuration
logging:
  log_dir: "./logs"
  tensorboard_dir: "./runs"
  log_interval: 10
  save_interval: 1
  
# Reproducibility
seed: 42
deterministic: true
